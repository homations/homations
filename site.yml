---
- name: HOMATIONS PLAYBOOK
  hosts: all
  pre_tasks:
    - name: Create the homations internal network
      community.docker.docker_network:
        name: "{{ homations_internal_network }}"
  roles:
    - role: traefik
      tags:
        - traefik
    - role: keycloak/installation
      tags:
        - keycloak
    - role: portainer
      tags:
        - portainer
    - role: observability/alertmanager
      tags:
        - alertmanager
        - observability
    - role: observability/cadvisor
      tags:
        - cadvisor
        - observability
    - role: observability/node-exporter
      tags:
        - observability
    - role: observability/prometheus
      tags:
        - prometheus
        - observability
    - role: observability/promtail
      tags:
        - observability
        - logging
    - role: observability/loki
      tags:
        - observability
        - logging
    - role: influxdb
      tags:
        - influxdb
    - role: grafana/installation
      tags:
        - grafana
    - role: node-red
      tags:
        - node-red
