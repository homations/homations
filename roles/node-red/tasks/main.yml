---
- name: Start Node-RED
  when: node_red_enabled is true
  block:
    - name: Create Node-RED Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ node_red_data_directory }}"

    - name: Create the Node-RED Docker Volume
      when: homations_docker_volume_enabled is true
      community.docker.docker_volume:
        name: "{{ node_red_volume_name }}"
        driver: local
        driver_options:
          type: none
          device: "{{ node_red_data_directory }}"
          o: bind

    - name: Node-RED Docker Container
      vars:
        homations_proxy_docker_network:
          - name: "{{ homations_traefik_network }}"
        homations_internal_docker_network:
          - name: "{{ homations_internal_network }}"
        node_red_docker_network: "{{ homations_internal_docker_network + homations_proxy_docker_network if node_red_available_externally else homations_internal_docker_network }}"
        node_red_volume_spec: "{{ node_red_volume_name if (homations_docker_volume_enabled) else node_red_data_directory }}"
        node_red_traefik_middleware_list_allowlist: ["nodered-ipallowlist"]
        node_red_traefik_middleware_list_forwardauth: "{{ ['nodered-basicauth'] if (node_red_basicauth_enabled) else [] }}"
        node_red_traefik_middleware_list: "{{ node_red_traefik_middleware_list_allowlist + node_red_traefik_middleware_list_forwardauth }}"
      community.docker.docker_container:
        name: "{{ node_red_container_name }}"
        image: "{{ node_red_image_name }}:{{ node_red_image_version }}"
        image_name_mismatch: "recreate"
        pull: true
        env: TZ={{ homations_timezone }}
        networks: "{{ node_red_docker_network }}"
        volumes:
          - "{{ node_red_volume_spec }}:/data:rw"
        restart_policy: "{{ node_red_restart_policy }}"
        # memory: "{{ node_red_memory }}"
        labels:
          traefik.enable: "{{ node_red_available_externally | string }}"
          traefik.docker.network: "{{ homations_traefik_network }}"
          traefik.http.routers.nodered.rule: "Host(`{{ node_red_hostname }}.{{ homations_domain }}`)"
          traefik.http.routers.nodered.entrypoints: "https"
          traefik.http.routers.nodered.tls.certresolver: "dnsresolver"
          traefik.http.routers.nodered.tls.domains[0].main: "{{ homations_domain }}"
          traefik.http.routers.nodered.tls.domains[0].sans: "*.{{ homations_domain }}"
          traefik.http.services.nodered.loadbalancer.server.port: "1880"
          traefik.http.middlewares.nodered-chain.chain.middlewares: "{{ node_red_traefik_middleware_list | join(', ') }}"
          traefik.http.middlewares.nodered-ipallowlist.ipallowlist.sourcerange: "{{ node_red_ip_allowlist }}"
          traefik.http.middlewares.nodered-basicauth.basicauth.users: "{{ node_red_basicauth_htpasswd }}"
          traefik.http.routers.nodered.middlewares: "nodered-chain"

- name: Stop Node-RED
  when: node_red_enabled is false
  block:
    - name: Stop Node-RED
      community.docker.docker_container:
        name: "{{ node_red_container_name }}"
        state: absent
