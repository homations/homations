---
- name: Start Bind9
  vars:
    bind9_dns_entries_necessary:
      - "{{ grafana_available_externally }}"
      - "{{ influxdb_available_externally }}"
      - "{{ keycloak_available_externally }}"
      - "{{ node_red_available_externally }}"
      - "{{ observability_alertmanager_available_externally }}"
      - "{{ observability_prometheus_available_externally }}"
      - "{{ portainer_available_externally }}"
      - "{{ traefik_ui_available_externally }}"
    bind9_dns_entries_hostnames:
      - "{{ grafana_hostname }}"
      - "{{ influxdb_hostname }}"
      - "{{ keycloak_hostname }}"
      - "{{ node_red_hostname }}"
      - "{{ observability_alertmanager_hostname }}"
      - "{{ observability_prometheus_hostname }}"
      - "{{ portainer_hostname }}"
      - "{{ traefik_ui_hostname }}"
    bind9_dns_entries: "{{ dict(bind9_dns_entries_hostnames | zip(bind9_dns_entries_necessary)) }}"
  when: bind9_enabled is true
  block:
    - name: Create Bind9 Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      with_items:
        - "{{ bind9_cache_directory }}"
        - "{{ bind9_config_directory }}"
        - "{{ bind9_records_directory }}"

    - name: Create the Bind9 Cache Docker Volume
      when: homations_docker_volume_enabled is true
      community.docker.docker_volume:
        name: "{{ bind9_cache_volume_name }}"
        driver: local
        driver_options:
          type: none
          device: "{{ bind9_cache_directory }}"
          o: bind

    - name: Create the Bind9 Records Docker Volume
      when: homations_docker_volume_enabled is true
      community.docker.docker_volume:
        name: "{{ bind9_records_volume_name }}"
        driver: local
        driver_options:
          type: none
          device: "{{ bind9_records_directory }}"
          o: bind

    - name: Template Bind9 named.conf
      ansible.builtin.template:
        src: named.conf.j2
        dest: "{{ bind9_config_directory }}/named.conf"
      register: named_conf_template_config

    - name: Template Bind9 db.domain
      when: homations_domain != "traefik.me"
      ansible.builtin.template:
        src: db.domain.j2
        dest: "{{ bind9_config_directory }}/db.{{ homations_domain }}"
      register: db_template_config_domain

    - name: Set db.domain.me fact
      when: homations_domain != "traefik.me"
      ansible.builtin.set_fact:
        bind9_db_volumes_string: >
          {{ db_template_config_domain.dest }}:/etc/bind/{{ db_template_config_domain.dest | basename }}

    - name: Template Bind9 db.traefik.me
      when: homations_domain == "traefik.me"
      ansible.builtin.template:
        src: db.traefik.me.j2
        dest: "{{ bind9_config_directory }}/db.{{ item.1 }}.traefik.me"
      register: db_template_config_traefik_me
      with_indexed_items: "{{ bind9_dns_entries_hostnames }}"

    - name: Set db.traefik.me fact
      when: homations_domain == "traefik.me"
      vars:
        tmp_db_volumes_string: >
          {% for result in db_template_config_traefik_me.results %}
          {{ result.dest }}:/etc/bind/{{ result.dest | basename }}{% if not loop.last %},{% endif %}
          {% endfor %}
      ansible.builtin.set_fact: bind9_db_volumes_string="{{ tmp_db_volumes_string }}"

    - name: Template Bind9 named.conf.options
      ansible.builtin.template:
        src: named.conf.options.j2
        dest: "{{ bind9_config_directory }}/named.conf.options"
      register: named_conf_options_template_config

    - name: Bind9 Docker Container
      vars:
        bind9_db_volumes: "{{ bind9_db_volumes_string | split(',') | map('trim') | list }}"
        bind9_cache_volume_spec: "{{ bind9_cache_volume_name if (homations_docker_volume_enabled) else bind9_cache_directory }}"
        bind9_records_volume_spec: "{{ bind9_records_volume_name if (homations_docker_volume_enabled) else bind9_records_directory }}"
        bind9_other_volumes:
          - "{{ bind9_config_directory }}/named.conf:/etc/bind/named.conf.local"
          - "{{ bind9_config_directory }}/named.conf.options:/etc/bind/named.conf.options"
          - "{{ bind9_cache_volume_spec }}:/var/cache/bind"
          - "{{ bind9_records_volume_spec }}:/var/lib/bind"
        bind9_volumes: "{{ bind9_db_volumes + bind9_other_volumes }}"
      community.docker.docker_container:
        name: "{{ bind9_container_name }}"
        image: "{{ bind9_image_name }}:{{ bind9_image_version }}"
        pull: true
        env:
          TZ: "{{ homations_timezone }}"
        volumes: "{{ bind9_volumes }}"
        networks:
          - name: "{{ homations_internal_network }}"
        ports:
          - "{{ bind9_port }}:53/tcp"
          - "{{ bind9_port }}:53/udp"
          - "8053:8053"
        restart_policy: unless-stopped
        # memory: "{{ bind9_memory }}"

- name: Stop Bind9
  when: bind9_enabled is false
  block:
    - name: Stop Bind9
      community.docker.docker_container:
        name: "{{ bind9_container_name }}"
        state: absent

    - name: Remove the Bind9 Docker Volume
      when: homations_docker_volume_enabled is true
      community.docker.docker_volume:
        name: "{{ item }}"
        state: absent
      with_items:
        - "{{ bind9_cache_volume_name }}"
        - "{{ bind9_records_volume_name }}"
